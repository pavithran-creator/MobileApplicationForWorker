version: "3.9"
services:
  db:
    image: mysql:8.0
    container_name: ondemand_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: ondemand
      MYSQL_USER: ondemand
      MYSQL_PASSWORD: ondemand123
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql

  backend:
    build: ./backend
    container_name: ondemand_backend
    restart: always
    environment:
      DATABASE_URL: mysql+pymysql://ondemand:ondemand123@db:3306/ondemand
      JWT_SECRET: change-me-super-secret-min-32-chars-123456
      DEMO_MODE: "true"
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  dbdata:
